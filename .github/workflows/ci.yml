name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        typescript: ["5.4.5", "6.0.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts typescript@${{ matrix.typescript }}
      - run: npm test
